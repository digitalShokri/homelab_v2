global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'homelab-monitoring'
    environment: 'production'

# Load alerting rules
rule_files:
  - "rules/*.yml"

# Alertmanager configuration (optional - add if you set up Alertmanager)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - Host metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'homelab-server'

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'homelab-server'

  # OpenTelemetry Collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # Loki metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # NVIDIA GPU metrics
  - job_name: 'nvidia-gpu'
    static_configs:
      - targets: ['nvidia-gpu-exporter:9445']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'homelab-server'

  # Tempo (trace storage; span metrics arrive via remote write)
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  # Grafana Alloy (log shipper to Loki)
  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:12345']

  # n8n (optional add-on, profile "n8n"; N8N_METRICS=true serves /metrics).
  # Static, not dns_sd: dns_sd logs an ERROR every refresh while the add-on is
  # off. So this target shows down when n8n is disabled; no alert on it.
  - job_name: 'n8n'
    static_configs:
      - targets: ['n8n:5678']

  # --- 404ambitions site stack (~/Projects/404ambitions) ---
  # Joins the `monitoring` network with these aliases. Do not rename the
  # network or remove these jobs without updating that project.
  - job_name: '404ambitions-mysql'
    static_configs:
      - targets: ['ambitions-mysqld-exporter:9104']
        labels:
          deployment_environment: 'home'
  - job_name: '404ambitions-cloudflared'
    static_configs:
      - targets: ['ambitions-cloudflared:2000']
        labels:
          deployment_environment: 'home'
